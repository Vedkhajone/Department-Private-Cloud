events {}

http {
    server {
        listen 80;

        # Everything under /api/ goes to the FastAPI backend.
        location /api/ {
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # NGINX defaults to a 1MB request body limit, which would
            # silently reject most file uploads. The backend's own
            # per-user storage quota (see /api/storage/usage) is the
            # real limit -- this just needs to be generous enough not
            # to get in its way.
            client_max_body_size 1024m;
        }

        # Hosted static websites (Phase 4). The backend resolves the
        # slug and serves the matching website's files -- no NGINX
        # config changes are ever needed when a new site is deployed.
        location /sites/ {
            proxy_pass http://backend:8000/sites/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Hosted dynamic websites (Phase 4). The backend reverse-
        # proxies to the matching website's isolated container.
        location /apps/ {
            proxy_pass http://backend:8000/apps/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 1024m;

            # In case a deployed app itself uses websockets.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Everything else goes to the React (Vite) dev server.
        location / {
            proxy_pass http://frontend:5173/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Required so Vite's dev server websocket (HMR) works
            # when proxied through NGINX.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
